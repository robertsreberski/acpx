<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef2ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111713" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Local workspace for ACPX coding sessions." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ACPX" />
    <!-- `default`, not `black-translucent`: translucent forces white status bar
         glyphs, which vanish against the light theme's pale header. With
         `default` iOS tints the bar from the theme-color pair above and picks a
         legible foreground for each theme itself. The safe-area insets in the
         stylesheet stay correct either way. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>ACPX Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
